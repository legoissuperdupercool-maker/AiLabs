name: Build Windows installer

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build installer
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: AI-Labs-Office-Setup
          path: dist/*.exe
          if-no-files-found: error

      # Every push gets a downloadable release on the repo's Releases page.
      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('AI Labs Office (build {0})', github.run_number) }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Download **AI-Labs-Office-Setup-*.exe** below and run it to install AI Labs Office.
            Windows may show a SmartScreen warning because the installer isn't signed: click *More info → Run anyway*.
          files: dist/*.exe
