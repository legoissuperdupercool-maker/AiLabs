<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
  <title>AI Labs Office</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="titlebar">
    <div class="brand">
      <canvas id="brandIcon" width="22" height="22"></canvas>
      <span class="brand-name">AI Labs <b>Office</b></span>
    </div>
    <nav class="tabs" id="tabs">
      <button data-view="office" class="active">Office</button>
      <button data-view="tasks">Task Board <span class="pill" id="taskCount"></span></button>
      <button data-view="settings">Settings</button>
    </nav>
    <div class="title-stats" id="titleStats"></div>
  </header>

  <main class="app">
    <!-- OFFICE -->
    <section class="view active" id="view-office">
      <div class="office-left">
        <div class="stage"><canvas id="officeCanvas"></canvas></div>
        <div class="roster" id="roster"></div>
      </div>
      <aside class="side" id="side"></aside>
    </section>

    <!-- TASKS -->
    <section class="view" id="view-tasks">
      <div class="board-head">
        <div>
          <h2>Task Board</h2>
          <p class="muted">Assign work to your agents. Agents can also hand tasks to each other.</p>
        </div>
        <button class="btn primary" id="newTaskBtn">+ New task</button>
      </div>
      <div class="board" id="board"></div>
    </section>

    <!-- SETTINGS -->
    <section class="view" id="view-settings">
      <div class="settings-wrap" id="settings"></div>
    </section>
  </main>

  <div class="modal-root" id="modalRoot"></div>
  <div class="toasts" id="toasts"></div>

  <script src="js/util.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/scene.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
